{% extends 'base.html' %}
{% block title %}Profiles List{% endblock %}
{% block  content %}

<h1>Profiles</h1>
<ul>
    {% for p in profiles %}
    <li>
        <a href="{% url 'profile-detail' p.pk %}">
            {{ p.full_name }} - {{ p.role }}
        </a>
    </li>
    {% empty %}
    <li>
        No profile
    </li>
    {% endfor %}
</ul>
{% endblock %}
